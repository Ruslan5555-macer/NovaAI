
name: Build NovaAI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          mkdir source
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d source
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NovaAI-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
